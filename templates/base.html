<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}KBD Simple Boarding{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <div class="page-shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark">K</span>
          <div>
            <strong>KBD</strong>
            <small>Simple Boarding</small>
          </div>
        </div>

        <nav class="nav">
          <a class="{% if request.path == '/' %}active{% endif %}" href="/">Dashboard</a>
          <a class="{% if request.path == '/employees' %}active{% endif %}" href="/employees">Mitarbeiter</a>
          <a class="{% if request.path == '/locations' %}active{% endif %}" href="/locations">Standorte</a>
          <a class="{% if request.path == '/functions' %}active{% endif %}" href="/functions">Funktionen</a>
          <a class="{% if request.path == '/jobs' %}active{% endif %}" href="/jobs">Jobs</a>
          <a class="{% if request.path == '/process-types' %}active{% endif %}" href="/process-types">Prozessarten</a>
          <a class="{% if request.path == '/roles' %}active{% endif %}" href="/roles">Rollen</a>
          <a class="{% if request.path == '/email-templates' %}active{% endif %}" href="/email-templates">E-Mail-Vorlagen</a>
          <a class="{% if request.path == '/api/employees' %}active{% endif %}" href="/api/employees">API</a>
        </nav>
      </aside>

      <main class="main-content">
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
