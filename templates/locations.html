{% extends 'base.html' %}

{% block title %}Standorte CRUD{% endblock %}

{% block content %}
  <header class="topbar">
    <div>
      <p class="eyebrow">Stammdaten</p>
      <h1>Standorte</h1>
    </div>
    <button class="primary-btn" id="add-location-btn" type="button">Neuer Standort</button>
  </header>

  <section class="panel">
    <div class="panel-header">
      <h2>Standortliste</h2>
      <span id="location-count">0 Standorte</span>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Status</th>
            <th class="th-action">Aktionen</th>
          </tr>
        </thead>
        <tbody id="locations-tbody">
          <tr><td colspan="4" class="table-message">Lädt...</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <div id="location-modal-overlay" class="modal-overlay is-hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="location-modal-title">
      <div class="modal-header">
        <h2 id="location-modal-title">Neuer Standort</h2>
        <button class="close-btn" id="close-location-modal" type="button" aria-label="Dialog schließen">&times;</button>
      </div>

      <form id="location-form">
        <input type="hidden" id="location-id">

        <div class="form-group">
          <label for="location-name">Name:</label>
          <input type="text" id="location-name" required maxlength="255">
        </div>

        <label class="checkbox-field" for="location-active">
          <input type="checkbox" id="location-active" checked>
          <span>Standort ist aktiv</span>
        </label>

        <p id="location-form-message" class="form-message" role="alert"></p>

        <div class="modal-actions">
          <button type="submit" class="primary-btn">Speichern</button>
          <button type="button" class="secondary-btn" id="cancel-location-modal">Abbrechen</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let locations = [];
    let currentLocationId = null;

    document.addEventListener('DOMContentLoaded', () => {
      loadLocations();
      document.getElementById('add-location-btn').addEventListener('click', openNewLocationModal);
      document.getElementById('close-location-modal').addEventListener('click', closeLocationModal);
      document.getElementById('cancel-location-modal').addEventListener('click', closeLocationModal);
      document.getElementById('location-form').addEventListener('submit', saveLocation);
    });

    async function loadLocations() {
      try {
        const response = await fetch('/api/locations');
        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.message || 'Standorte konnten nicht geladen werden.');
        }

        locations = data.locations || [];
        renderLocations();
      } catch (error) {
        document.getElementById('locations-tbody').innerHTML =
          `<tr><td colspan="4" class="table-message table-message-error">${escapeHtml(error.message)}</td></tr>`;
      }
    }

    function renderLocations() {
      const tbody = document.getElementById('locations-tbody');
      document.getElementById('location-count').textContent = `${locations.length} Standorte`;

      if (locations.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="table-message">Keine Standorte gefunden.</td></tr>';
        return;
      }

      tbody.innerHTML = locations.map(location => `
        <tr>
          <td>${location.id}</td>
          <td>${escapeHtml(location.name)}</td>
          <td><span class="status-pill ${location.active ? 'status-active' : 'status-inactive'}">${location.active ? 'Aktiv' : 'Inaktiv'}</span></td>
          <td>
            <div class="action-btns">
              <button class="edit-btn" type="button" data-action="edit" data-id="${location.id}" title="Bearbeiten">E</button>
              <button class="delete-btn" type="button" data-action="delete" data-id="${location.id}" title="Löschen">-</button>
            </div>
          </td>
        </tr>
      `).join('');

      tbody.querySelectorAll('[data-action="edit"]').forEach(button => {
        button.addEventListener('click', () => openEditLocationModal(Number(button.dataset.id)));
      });
      tbody.querySelectorAll('[data-action="delete"]').forEach(button => {
        button.addEventListener('click', () => deleteLocation(Number(button.dataset.id)));
      });
    }

    function openNewLocationModal() {
      currentLocationId = null;
      document.getElementById('location-modal-title').textContent = 'Neuer Standort';
      document.getElementById('location-form').reset();
      document.getElementById('location-active').checked = true;
      setLocationFormMessage('');
      showLocationModal();
    }

    function openEditLocationModal(locationId) {
      const location = locations.find(item => item.id === locationId);
      if (!location) return;

      currentLocationId = locationId;
      document.getElementById('location-modal-title').textContent = 'Standort bearbeiten';
      document.getElementById('location-id').value = location.id;
      document.getElementById('location-name').value = location.name;
      document.getElementById('location-active').checked = location.active;
      setLocationFormMessage('');
      showLocationModal();
    }

    async function saveLocation(event) {
      event.preventDefault();
      const name = document.getElementById('location-name').value.trim();
      const active = document.getElementById('location-active').checked;

      if (!name) {
        setLocationFormMessage('Bitte einen Namen eingeben.');
        return;
      }

      const url = currentLocationId ? `/api/locations/${currentLocationId}` : '/api/locations';
      const method = currentLocationId ? 'PUT' : 'POST';

      try {
        const response = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, active })
        });
        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.message || 'Speichern fehlgeschlagen.');
        }

        closeLocationModal();
        await loadLocations();
      } catch (error) {
        setLocationFormMessage(error.message);
      }
    }

    async function deleteLocation(locationId) {
      if (!await window.showDeleteConfirm('Diesen Standort wirklich löschen?')) return;

      try {
        const response = await fetch(`/api/locations/${locationId}`, { method: 'DELETE' });
        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.message || 'Löschen fehlgeschlagen.');
        }

        await loadLocations();
      } catch (error) {
        window.alert(error.message);
      }
    }

    function showLocationModal() {
      document.getElementById('location-modal-overlay').classList.remove('is-hidden');
      document.getElementById('location-name').focus();
    }

    function closeLocationModal() {
      document.getElementById('location-modal-overlay').classList.add('is-hidden');
      currentLocationId = null;
    }

    function setLocationFormMessage(message) {
      const element = document.getElementById('location-form-message');
      element.textContent = message;
      element.classList.toggle('is-visible', Boolean(message));
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }
  </script>
{% endblock %}
