{% extends 'base.html' %}

{% block title %}SIMBO - Rollen{% endblock %}

{% block content %}
  <header class="topbar">
    <div>
      <p class="eyebrow">Stammdaten</p>
      <h1>Rollen</h1>
    </div>
    <button class="primary-btn" id="add-role-btn" type="button">Neue Rolle</button>
  </header>

  <section class="panel">
    <div class="panel-header">
      <h2>Rollenliste</h2>
      <span id="role-count">0 Rollen</span>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>
              <span class="sortable-heading">Name <span class="sort-buttons">
                <button class="sort-btn" type="button" data-sort-direction="asc" aria-label="Name aufsteigend sortieren" title="ASC">↑</button>
                <button class="sort-btn" type="button" data-sort-direction="desc" aria-label="Name absteigend sortieren" title="DESC">↓</button>
              </span></span>
            </th>
            <th class="th-action">Aktionen</th>
          </tr>
        </thead>
        <tbody id="roles-tbody">
          <tr><td colspan="3" class="table-message">Lädt...</td></tr>
        </tbody>
      </table>
    </div>

    <div id="role-pagination" class="table-pagination is-hidden" aria-label="Rollennavigation">
      <button class="pagination-btn" id="role-prev-page" type="button" aria-label="Vorheriges Datenpaket">←</button>
      <span class="pagination-info" id="role-page-info"></span>
      <button class="pagination-btn" id="role-next-page" type="button" aria-label="Nächstes Datenpaket">→</button>
    </div>
  </section>

  <div id="role-modal-overlay" class="modal-overlay is-hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="role-modal-title">
      <div class="modal-header">
        <h2 id="role-modal-title">Neue Rolle</h2>
        <button class="close-btn" id="close-role-modal" type="button" aria-label="Dialog schließen">&times;</button>
      </div>

      <form id="role-form">
        <input type="hidden" id="role-id">
        <div class="form-group">
          <label for="role-name">Name:</label>
          <input type="text" id="role-name" required maxlength="255">
        </div>
        <p id="role-form-message" class="form-message" role="alert"></p>
        <div class="modal-actions">
          <button type="submit" class="primary-btn">Speichern</button>
          <button type="button" class="secondary-btn" id="cancel-role-modal">Abbrechen</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let roles = [];
    let currentRoleId = null;
    let rolePage = 1;
    const rolePageSize = 800;
    let roleSortDirection = 'asc';

    document.addEventListener('DOMContentLoaded', () => {
      loadRoles();
      document.getElementById('add-role-btn').addEventListener('click', openNewRoleModal);
      document.getElementById('close-role-modal').addEventListener('click', closeRoleModal);
      document.getElementById('cancel-role-modal').addEventListener('click', closeRoleModal);
      document.getElementById('role-form').addEventListener('submit', saveRole);
      document.getElementById('role-prev-page').addEventListener('click', () => changeRolePage(-1));
      document.getElementById('role-next-page').addEventListener('click', () => changeRolePage(1));
      document.querySelectorAll('[data-sort-direction]').forEach(button => {
        button.addEventListener('click', () => {
          roleSortDirection = button.dataset.sortDirection;
          rolePage = 1;
          renderRoles();
        });
      });
    });

    async function loadRoles() {
      try {
        const response = await fetch('/api/roles');
        const data = await response.json();
        if (!response.ok || !data.success) {
          throw new Error(data.message || 'Rollen konnten nicht geladen werden.');
        }
        roles = data.roles || [];
        rolePage = 1;
        renderRoles();
      } catch (error) {
        document.getElementById('roles-tbody').innerHTML =
          `<tr><td colspan="3" class="table-message table-message-error">${escapeHtml(error.message)}</td></tr>`;
      }
    }

    function renderRoles() {
      const tbody = document.getElementById('roles-tbody');
      document.getElementById('role-count').textContent = `${roles.length} Rollen`;
      const totalPages = Math.max(1, Math.ceil(roles.length / rolePageSize));

      if (roles.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" class="table-message">Keine Rollen gefunden.</td></tr>';
        updateRolePagination(totalPages);
        return;
      }

      const sortedRoles = [...roles].sort((first, second) => {
        const comparison = String(first.name || '').localeCompare(String(second.name || ''), 'de', { sensitivity: 'base' });
        return roleSortDirection === 'asc' ? comparison : -comparison;
      });
      const startIndex = (rolePage - 1) * rolePageSize;
      const pageItems = sortedRoles.slice(startIndex, startIndex + rolePageSize);

      document.querySelectorAll('[data-sort-direction]').forEach(button => {
        button.classList.toggle('sort-btn-active', button.dataset.sortDirection === roleSortDirection);
      });

      tbody.innerHTML = pageItems.map(item => `
        <tr>
          <td>${item.id}</td>
          <td>${escapeHtml(item.name)}</td>
          <td>
            <div class="action-btns">
              <button class="edit-btn" type="button" data-action="edit" data-id="${item.id}" title="Bearbeiten">E</button>
              <button class="delete-btn" type="button" data-action="delete" data-id="${item.id}" title="Löschen">-</button>
            </div>
          </td>
        </tr>
      `).join('');

      tbody.querySelectorAll('[data-action="edit"]').forEach(button => {
        button.addEventListener('click', () => openEditRoleModal(Number(button.dataset.id)));
      });
      tbody.querySelectorAll('[data-action="delete"]').forEach(button => {
        button.addEventListener('click', () => deleteRole(Number(button.dataset.id)));
      });
      updateRolePagination(totalPages);
    }

    function updateRolePagination(totalPages) {
      const pagination = document.getElementById('role-pagination');
      pagination.classList.toggle('is-hidden', roles.length <= rolePageSize);
      document.getElementById('role-prev-page').disabled = rolePage <= 1;
      document.getElementById('role-next-page').disabled = rolePage >= totalPages;
      document.getElementById('role-page-info').textContent = `Datenpaket ${rolePage} von ${totalPages}`;
    }

    function changeRolePage(offset) {
      const totalPages = Math.max(1, Math.ceil(roles.length / rolePageSize));
      rolePage = Math.min(totalPages, Math.max(1, rolePage + offset));
      renderRoles();
    }

    function openNewRoleModal() {
      currentRoleId = null;
      document.getElementById('role-modal-title').textContent = 'Neue Rolle';
      document.getElementById('role-form').reset();
      setRoleFormMessage('');
      showRoleModal();
    }

    function openEditRoleModal(roleId) {
      const item = roles.find(entry => entry.id === roleId);
      if (!item) return;
      currentRoleId = roleId;
      document.getElementById('role-modal-title').textContent = 'Rolle bearbeiten';
      document.getElementById('role-id').value = item.id;
      document.getElementById('role-name').value = item.name;
      setRoleFormMessage('');
      showRoleModal();
    }

    async function saveRole(event) {
      event.preventDefault();
      const name = document.getElementById('role-name').value.trim();
      if (!name) {
        setRoleFormMessage('Bitte einen Namen eingeben.');
        return;
      }

      const url = currentRoleId ? `/api/roles/${currentRoleId}` : '/api/roles';
      const method = currentRoleId ? 'PUT' : 'POST';
      try {
        const response = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name })
        });
        const data = await response.json();
        if (!response.ok || !data.success) {
          throw new Error(data.message || 'Speichern fehlgeschlagen.');
        }
        closeRoleModal();
        await loadRoles();
      } catch (error) {
        setRoleFormMessage(error.message);
      }
    }

    async function deleteRole(roleId) {
      if (!await window.showDeleteConfirm('Diese Rolle wirklich löschen?')) return;
      try {
        const response = await fetch(`/api/roles/${roleId}`, { method: 'DELETE' });
        const data = await response.json();
        if (!response.ok || !data.success) {
          throw new Error(data.message || 'Löschen fehlgeschlagen.');
        }
        await loadRoles();
      } catch (error) {
        window.alert(error.message);
      }
    }

    function showRoleModal() {
      document.getElementById('role-modal-overlay').classList.remove('is-hidden');
      document.getElementById('role-name').focus();
    }

    function closeRoleModal() {
      document.getElementById('role-modal-overlay').classList.add('is-hidden');
      currentRoleId = null;
    }

    function setRoleFormMessage(message) {
      const element = document.getElementById('role-form-message');
      element.textContent = message;
      element.classList.toggle('is-visible', Boolean(message));
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }
  </script>
{% endblock %}
